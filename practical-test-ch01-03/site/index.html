<!-- Câu 1a: viết trang danh sách các sự kiện -->
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduHub Web</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="#">EduHub Web</a>
      <nav aria-label="Điều hướng chính">
        <ul>
          <li><a href="#">Trang chủ</a></li>
          <li><a href="#">Sự kiện</a></li>
          <li><a href="#">Đăng ký</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Sự kiện sắp diễn ra</h1>

      <form id="search-form" action="#" method="get">
        <label for="keyword">Tìm sự kiện</label>
        <input
          id="keyword"
          name="q"
          type="search"
          placeholder="Tìm sự kiện..."
        />
        <button type="submit">Tìm</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>

      <div id="event-list" class="event-list">
        <article class="event-card">
          <img src="img/event.svg" alt="Workshop Git &amp; GitHub cho tân sinh viên" />
          <h2>
            <a href="event-detail.html?id=22222222-2222-4222-8222-000000000001">
              Workshop Git &amp; GitHub cho tân sinh viên
            </a>
          </h2>
          <p>
            <time datetime="2026-09-12T01:00:00.000Z">08:00, 12/09/2026</time>
          </p>
          <p>Phòng máy A3.201</p>
          <p>Còn 12/40 chỗ</p>
        </article>

        <article class="event-card">
          <img src="img/event.svg" alt="Hackathon EduHub 24 giờ" />
          <h2>
            <a href="event-detail.html?id=22222222-2222-4222-8222-000000000004">
              Hackathon EduHub 24 giờ
            </a>
          </h2>
          <p>
            <time datetime="2026-12-19T01:00:00.000Z">08:00, 19/12/2026</time>
          </p>
          <p>Phòng máy A3.205</p>
          <p><span class="sold-out">Hết chỗ</span></p>
        </article>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 EduHub Web</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
